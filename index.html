<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chìa Khóa V2 - Google Sheets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 30px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .card-header { font-weight: bold; color: white; }
        .bg-dark-custom { background-color: #212529; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 text-primary">🔑 QUẢN LÝ CHÌA KHÓA (DỮ LIỆU GOOGLE SHEETS)</h2>
    
    <div class="text-end mb-3">
        <button class="btn btn-primary fw-bold" onclick="loadDataFromSheets()">🔄 Tải lại dữ liệu</button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header bg-dark-custom">Danh Sách Tủ Khóa</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Mã Chìa</th>
                                <th>Phòng / Vị trí</th>
                                <th>Trạng Thái</th>
                                <th>Người Đang Giữ</th>
                            </tr>
                        </thead>
                        <tbody id="keysTableBody">
                            <tr><td colspan="4" class="text-muted py-3">Đang tải dữ liệu từ Google Sheets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // DÁN ĐOẠN URL WEB APP BẠN COPY Ở BƯỚC 2 VÀO GIỮA HAI DẤU NHÁY ĐƠN DƯỚI ĐÂY
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOd8cu3mjC_eH7KaHyO6YvuBuUjIPrWXa2eatr8xK3lylbBTJkwATDmH_8rtUXbuPC/exec';

    // Hàm gọi dữ liệu từ Google Sheets
    function loadDataFromSheets() {
        const keysBody = document.getElementById('keysTableBody');
        keysBody.innerHTML = '<tr><td colspan="4" class="text-muted py-3">Đang tải dữ liệu từ đám mây...</td></tr>';

        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(keys => {
                renderData(keys);
            })
            .catch(error => {
                console.error('Lỗi:', error);
                keysBody.innerHTML = '<tr><td colspan="4" class="text-danger py-3">Lỗi kết nối tệp Sheets. Hãy kiểm tra lại link cấu hình!</td></tr>';
            });
    }

    // Đổ dữ liệu lên bảng HTML
    function renderData(keys) {
        const keysBody = document.getElementById('keysTableBody');
        if (!keysBody) return;
        
        keysBody.innerHTML = '';
        if (keys.length === 0) {
            keysBody.innerHTML = '<tr><td colspan="4" class="text-muted py-3">Chưa có dữ liệu chìa khóa nào trong tệp Sheets.</td></tr>';
            return;
        }

        keys.forEach(k => {
            const trangThaiText = k.trang_thai ? k.trang_thai.trim() : 'Có sẵn';
            const badge = trangThaiText === 'Có sẵn' 
                ? '<span class="badge bg-success">Có sẵn trong tủ</span>' 
                : '<span class="badge bg-danger">Đã cho mượn</span>';
            
            keysBody.innerHTML += `
                <tr>
                    <td><strong>${k.ma_chia}</strong></td>
                    <td>${k.ten_phong}</td>
                    <td>${badge}</td>
                    <td>${k.nguoi_muon || '-'}</td>
                </tr>`;
        });
    }

    // Tự động chạy tải dữ liệu ngay khi vừa mở trang web
    window.onload = loadDataFromSheets;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
