<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chìa Khóa - Google Sheets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 30px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .card-header { font-weight: bold; color: white; }
        .bg-dark-custom { background-color: #212529; }
        .header-title { color: #0d6efd; font-weight: bold; text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">🔑 QUẢN LÝ CHÌA KHÓA (DỮ LIỆU GOOGLE SHEETS)</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-success">Thêm Chìa Khóa Mới</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Mã chìa khóa</label>
                        <input type="text" id="newKeyId" class="form-control" placeholder="Ví dụ: C101">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tên phòng / Vị trí</label>
                        <input type="text" id="newKeyRoom" class="form-control" placeholder="Ví dụ: Phòng Y tế">
                    </div>
                    <button class="btn btn-success w-100 fw-bold" onclick="addKey()">Thêm vào hệ thống</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-primary">Thao tác Mượn / Trả</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Mã chìa khóa</label>
                        <input type="text" id="actionKeyId" class="form-control" placeholder="Nhập mã cần mượn/trả">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tên người mượn (Bỏ trống nếu là Trả)</label>
                        <input type="text" id="actionPerson" class="form-control" placeholder="Nguyễn Văn A">
                    </div>
                    <button class="btn btn-primary w-100 fw-bold" onclick="updateKey()">Xác nhận thao tác</button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="d-flex justify-content-end mb-2">
                <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="loadDataFromSheets()">🔄 Làm mới danh sách</button>
            </div>
            
            <div class="card">
                <div class="card-header bg-dark-custom">Danh Sách Tủ Khóa</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Mã Chìa</th>
                                <th>Phòng / Vị trí</th>
                                <th>Trạng Thái</th>
                                <th>Người Đang Giữ</th>
                            </tr>
                        </thead>
                        <tbody id="keysTableBody">
                            <tr><td colspan="4" class="text-muted py-3">Đang tải dữ liệu từ Google Sheets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-secondary">Nhật Ký Mượn / Trả Gần Đây</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 text-center align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Thời gian</th>
                                <th>Mã</th>
                                <th>Hành động</th>
                                <th>Người thực hiện</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="text-muted py-3">Chưa có lịch sử.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== DÁN LINK SCRIPT MỚI VÀO ĐÂY =====
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzo_YHGVkMVHabd6A8_WgJ6l90kzRTvvFSb-lKqz3egJiHrEJkLALbEbblkyUVFCAudfA/exec';

    // 1. TẢI DỮ LIỆU
    function loadDataFromSheets() {
        const keysBody = document.getElementById('keysTableBody');
        keysBody.innerHTML = '<tr><td colspan="4" class="text-muted py-3">Đang đồng bộ từ đám mây...</td></tr>';

        fetch(SCRIPT_URL + '?action=read')
            .then(res => res.json())
            .then(keys => renderData(keys))
            .catch(err => {
                keysBody.innerHTML = '<tr><td colspan="4" class="text-danger py-3">Lỗi tải dữ liệu. Kiểm tra lại link kết nối!</td></tr>';
            });
    }

    // HIỂN THỊ LÊN BẢNG
    function renderData(keys) {
        const keysBody = document.getElementById('keysTableBody');
        keysBody.innerHTML = '';
        if (keys.length === 0) {
            keysBody.innerHTML = '<tr><td colspan="4" class="text-muted py-3">Chưa có dữ liệu chìa khóa.</td></tr>';
            return;
        }

        keys.forEach(k => {
            const isAvailable = (k.trang_thai === 'Có sẵn' || k.trang_thai === '');
            const badge = isAvailable 
                ? '<span class="badge bg-success">Có sẵn trong tủ</span>' 
                : '<span class="badge bg-danger">Đã cho mượn</span>';
            
            keysBody.innerHTML += `
                <tr>
                    <td><strong>${k.ma_chia}</strong></td>
                    <td>${k.ten_phong}</td>
                    <td>${badge}</td>
                    <td>${k.nguoi_muon || '-'}</td>
                </tr>`;
        });
    }

    // 2. THÊM CHÌA KHÓA
    function addKey() {
        const id = document.getElementById('newKeyId').value.trim();
        const room = document.getElementById('newKeyRoom').value.trim();
        
        if (!id || !room) return alert("Vui lòng nhập đầy đủ mã và tên phòng!");
        
        // Hiện thông báo đang xử lý
        document.getElementById('newKeyId').value = "Đang lưu...";
        
        const url = `${SCRIPT_URL}?action=add&ma_chia=${encodeURIComponent(id)}&ten_phong=${encodeURIComponent(room)}`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('newKeyId').value = "";
                document.getElementById('newKeyRoom').value = "";
                loadDataFromSheets(); // Tải lại bảng sau khi thêm
                alert("Thêm thành công!");
            });
    }

    // 3. MƯỢN / TRẢ CHÌA KHÓA
    function updateKey() {
        const id = document.getElementById('actionKeyId').value.trim();
        const person = document.getElementById('actionPerson').value.trim(); // Bỏ trống = Trả
        
        if (!id) return alert("Vui lòng nhập mã chìa khóa cần thao tác!");
        
        document.getElementById('actionKeyId').value = "Đang xử lý...";

        const url = `${SCRIPT_URL}?action=update&ma_chia=${encodeURIComponent(id)}&nguoi_muon=${encodeURIComponent(person)}`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('actionKeyId').value = "";
                document.getElementById('actionPerson').value = "";
                loadDataFromSheets(); // Tải lại bảng
                alert("Thao tác thành công!");
            });
    }

    // Tự động chạy khi mở web
    window.onload = loadDataFromSheets;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
